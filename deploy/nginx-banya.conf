# Битые URL вроде /%3C/p — Яндекс принял тег </p> за ссылку.
# Include отдаёт 410 на HTTP, без редиректа на HTTPS.

server {
    listen 80;
    server_name nikolaevskie.ru www.nikolaevskie.ru 89.108.88.31;

    include /etc/nginx/snippets/banya-gone-410.inc;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nikolaevskie.ru www.nikolaevskie.ru 89.108.88.31;

    ssl_certificate /etc/letsencrypt/live/nikolaevskie.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nikolaevskie.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    root /var/www/banya;
    index index.html;

    include /etc/nginx/snippets/banya-gone-410.inc;

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static images from React build (Logo, bg-home, etc.)
    location ^~ /img/ {
        root /var/www/banya;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/index.html $uri/ @spa;
    }

    # Главную с кодом 200 отдаём только реальным разделам, иначе 404
    location @spa {
        rewrite ^/(baths|booking|contacts|categories|admin)(/.*)?$ /index.html last;
        return 404;
    }

    location ^~ /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # User uploads (baths, products, support)
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
